<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSA 투어 — 한 장씩 쌓아 보는 마이크로서비스</title>
<style>
:root{
  --bg:#f6f7f5; --surface:#ffffff; --text:#1f2328; --muted:#5d6670; --line:#e1e4e0;
  --accent:#0b6e4f; --accent-soft:#dff3ea; --new:#d9480f; --new-soft:#fff0e6;
  --note:#fff7d6; --note-line:#e6c85a; --infra:#eef0ee; --user:#e8f0fe;
  --packet:#1f6feb; --dim:.28; --code:#eef0ed;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111412; --surface:#1a1e1c; --text:#e7eae6; --muted:#98a29c; --line:#2b312e;
    --accent:#5fd0a2; --accent-soft:#16302a; --new:#ff9a6c; --new-soft:#3a2418;
    --note:#3a351c; --note-line:#8a7a2a; --infra:#232826; --user:#1c2740;
    --packet:#6ea8ff; --code:#23282580;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;font-size:24px}  /* 16px의 150% */
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR","Segoe UI",sans-serif;line-height:1.6;word-break:keep-all}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.88em;background:var(--code);padding:.05em .35em;border-radius:0.25rem}
button{font:inherit;cursor:pointer}

.wrap{max-width:73.75rem;margin:0 auto;padding:1rem 1.25rem 2.5rem}
.topbar{display:flex;align-items:center;gap:0.875rem;flex-wrap:wrap;margin-bottom:0.625rem}
.topbar .brand{font-weight:700;font-size:.95rem}
.topbar .brand small{color:var(--muted);font-weight:400;margin-left:0.5rem}
.topbar .spacer{flex:1}
.topbar a.small{font-size:.85rem;color:var(--muted)}
.dots{display:flex;gap:0.375rem;flex-wrap:wrap}
.dots button{width:1.875rem;height:1.875rem;border-radius:50%;border:0.0625rem solid var(--line);background:var(--surface);color:var(--muted);font-size:.75rem;font-weight:700;padding:0}
.dots button.cur{background:var(--accent);border-color:var(--accent);color:#fff}
.dots button.done{border-color:var(--accent);color:var(--accent)}

.chap-head{display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin:0.875rem 0 0.625rem}
.chap-head .num{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.chap-head h1{margin:0.125rem 0 0;font-size:1.65rem;line-height:1.25}
.chap-head .en{color:var(--muted);font-size:.95rem}
.oneliner{font-size:1.05rem;margin:0 0 0.875rem;padding:0.75rem 1rem;background:var(--accent-soft);border-radius:0.625rem;border-left:0.25rem solid var(--accent)}

.sys{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-bottom:0.875rem}
.sys .chip{padding:0.125rem 0.625rem;border-radius:62.4375rem;border:0.0625rem solid var(--line);background:var(--surface);color:var(--text)}
.sys .chip.new{border-color:var(--new);background:var(--new-soft);color:var(--new);font-weight:700}
.sys .chip.new::before{content:"+ "}

.stage{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(18.75rem,1fr);gap:1.125rem;align-items:start}
@media (max-width:1350px){.stage{grid-template-columns:1fr}}  /* 900px × 1.5 — 미디어쿼리의 rem은 24px가 아닌 16px 기준이라 px로 명시 */
.viz{background:var(--surface);border:0.0625rem solid var(--line);border-radius:0.875rem;overflow:hidden}
.viz svg{display:block;width:100%;height:auto;background:var(--surface)}
.caption{padding:0.75rem 1rem;border-top:0.0625rem solid var(--line);min-height:4.625rem;display:flex;gap:0.75rem;align-items:flex-start}
.caption .idx{flex:none;width:1.875rem;height:1.875rem;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.85rem;margin-top:0.125rem}
.caption p{margin:0;font-size:1rem}
.controls{display:flex;gap:0.5rem;padding:0.625rem 1rem 0.875rem;flex-wrap:wrap;align-items:center}
.controls button{border:0.0625rem solid var(--line);background:var(--surface);color:var(--text);padding:0.4375rem 0.875rem;border-radius:0.5rem;font-size:.9rem}
.controls button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.controls button:disabled{opacity:.45;cursor:default}
.controls .hint{margin-left:auto;font-size:.78rem;color:var(--muted)}

.panel{display:flex;flex-direction:column;gap:0.75rem}
.card{background:var(--surface);border:0.0625rem solid var(--line);border-radius:0.75rem;padding:0.875rem 1rem}
.card h3{margin:0 0 0.5rem;font-size:.95rem;color:var(--muted);letter-spacing:.02em}
.card p{margin:0 0 0.5rem}.card p:last-child{margin-bottom:0}
.card ul{margin:0;padding-left:1.2em}.card li{margin:0.1875rem 0}
.steps{list-style:none;padding:0;margin:0}
.steps li{padding:0.4375rem 0.625rem;border-radius:0.5rem;cursor:pointer;display:flex;gap:0.625rem;font-size:.92rem;border:0.0625rem solid transparent}
.steps li:hover{background:var(--code)}
.steps li.cur{background:var(--accent-soft);border-color:var(--accent)}
.steps li .n{flex:none;width:1.375rem;height:1.375rem;border-radius:50%;border:0.0625rem solid var(--line);font-size:.75rem;display:flex;align-items:center;justify-content:center;margin-top:0.125rem;color:var(--muted)}
.steps li.cur .n{background:var(--accent);color:#fff;border-color:var(--accent)}
.look code{display:inline-block;margin:0.125rem 0}

.nav{display:flex;gap:0.75rem;align-items:center;margin-top:1.375rem}
.nav button{flex:1;padding:0.875rem 1rem;border-radius:0.75rem;border:0.0625rem solid var(--line);background:var(--surface);color:var(--text);font-size:1rem;text-align:left}
.nav button.next{text-align:right;background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.nav button:disabled{opacity:.4;cursor:default}
.nav button small{display:block;font-size:.75rem;opacity:.75;font-weight:400}
.nav .count{color:var(--muted);font-size:.9rem;white-space:nowrap}

/* SVG */
.node rect{stroke-width:1.5;transition:opacity .35s, stroke-width .2s}
.node text{font-family:inherit;transition:opacity .35s}
.node .lbl{font-size:14px;font-weight:700;fill:var(--text)}
.node .sub{font-size:11px;fill:var(--muted)}
.node.service rect{fill:var(--accent-soft);stroke:var(--accent)}
.node.infra rect{fill:var(--infra);stroke:var(--muted);stroke-dasharray:5 4}
.node.user rect{fill:var(--user);stroke:#5b8def}
.node.note rect{fill:var(--note);stroke:var(--note-line)}
.node.state rect{fill:var(--surface);stroke:var(--text);rx:29}
.node.isnew rect{stroke:var(--new);stroke-width:2.5}
.node .badge{font-size:9px;font-weight:800;fill:#fff}
.node .badgebg{fill:var(--new);stroke:none!important}
.node.focus rect{stroke-width:3}
.node.focus.service rect{fill:var(--accent);}
.node.focus.service .lbl,.node.focus.service .sub{fill:#fff}
.node.focus.state rect{fill:var(--accent);stroke:var(--accent)}
.node.focus.state .lbl,.node.focus.state .sub{fill:#fff}
.node.focus.infra rect{fill:var(--surface);stroke:var(--text);stroke-dasharray:none}
.node.focus.user rect{stroke-width:3}
.node.focus.note rect{stroke:var(--new);stroke-width:3}
.dimmed{opacity:var(--dim)}
.edge path{fill:none;stroke:var(--muted);stroke-width:1.6;transition:opacity .35s, stroke .2s}
.edge.dashed path{stroke-dasharray:5 4}
.edge.active path{stroke:var(--packet);stroke-width:2.6}
.edge text{font-size:10.5px;fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.edge.active text{fill:var(--packet);font-weight:700}
.group rect{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 5;rx:12}
.group text{font-size:11.5px;fill:var(--muted);font-weight:700}
.packet{fill:var(--packet);stroke:var(--surface);stroke-width:2.5;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.legend{font-size:10px;fill:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">MSA 투어 <small>Spring Microservices in Action 2판 · 한 장씩 쌓아 보기</small></div>
    <div class="spacer"></div>
    <div class="dots" id="dots"></div>
    <a class="small" href="index.html">상세 문서 ↗</a>
  </div>

  <div class="chap-head">
    <div><div class="num" id="cNum"></div><h1 id="cTitle"></h1></div>
    <div class="en" id="cEn"></div>
  </div>
  <p class="oneliner" id="cOne"></p>
  <div class="sys" id="cSys"></div>

  <div class="stage">
    <div class="viz">
      <svg id="svg" viewBox="0 0 900 492" xmlns="http://www.w3.org/2000/svg" aria-label="chapter diagram"></svg>
      <div class="caption"><div class="idx" id="capIdx">1</div><p id="capText"></p></div>
      <div class="controls">
        <button class="primary" id="btnPlay">⏸ 일시정지</button>
        <button id="btnPrevStep">‹ 이전 단계</button>
        <button id="btnNextStep">다음 단계 ›</button>
        <button id="btnRestart">↺ 처음부터</button>
        <span class="hint">키보드 ← → : 챕터 이동 · Space : 재생/정지</span>
      </div>
    </div>

    <div class="panel">
      <div class="card"><h3>왜 필요할까?</h3><div id="cWhy"></div></div>
      <div class="card"><h3>어떻게 해결할까?</h3><div id="cHow"></div></div>
      <div class="card"><h3>단계별로 보기 (클릭하면 이동)</h3><ol class="steps" id="cSteps"></ol></div>
      <div class="card look"><h3>코드에서 볼 곳</h3><ul id="cLook"></ul><p style="margin-top:8px"><a id="cLink" href="#">이 장 상세 문서 보기 →</a></p></div>
    </div>
  </div>

  <div class="nav">
    <button id="btnPrev"><small>이전 장</small><span id="prevLabel"></span></button>
    <span class="count" id="count"></span>
    <button id="btnNext" class="next"><small>다음 장</small><span id="nextLabel"></span></button>
  </div>
</div>

<script>
// ───────────────────────────── 데이터 ─────────────────────────────
const COMP = {hello:'Hello 앱',ls:'라이선싱 서비스',org:'조직 서비스',cfg:'Config 서버',eur:'Eureka',gw:'Gateway',auth:'인증 서비스',
  dk:'Docker',pg:'PostgreSQL',r4j:'Resilience4j',kc:'Keycloak',kf:'Kafka',rd:'Redis',elk:'ELK',zp:'Zipkin',pm:'Prometheus/Grafana',aws:'AWS EKS'};

// 노드 헬퍼: N(id, x, y, label, {sub, kind, new, w, h})
const N=(id,x,y,label,o={})=>({id,x,y,label,sub:o.sub||'',kind:o.kind||'service',isNew:!!o.new,w:o.w||150,h:o.h||58});
// 엣지: E(from, to, {label, dashed, arrow:false, bend})
const E=(f,t,o={})=>({f,t,label:o.label||'',dashed:!!o.dashed,arrow:o.arrow!==false,bend:o.bend||0});

const CH = [
{
 num:'1장', title:'스프링, 클라우드와 만나다', en:'Welcome to the cloud, Spring', page:'chapter01.html',
 one:'큰 앱 하나를 작은 앱 여러 개로 쪼개는 것이 마이크로서비스. 그 "작은 앱"을 Spring Boot로 만들면 파일 하나면 충분해요.',
 why:'<p>기능이 전부 한 프로그램에 들어 있으면(모놀리스) 한 줄만 고쳐도 전체를 다시 빌드·배포해야 하고, 팀이 커질수록 서로 발을 밟아요. 많이 쓰이는 기능만 늘리고 싶어도 통째로 늘려야 합니다.</p>',
 how:'<p>기능별로 독립된 작은 앱(서비스)으로 나누고, 각자 REST API(URL로 요청, JSON으로 응답)로 대화하게 합니다. Spring Boot는 내장 톰캣 덕분에 <code>java -jar</code> 한 번으로 서비스가 뜹니다.</p>',
 look:['<code>chapter1/simple-application/…/Application.java</code> — 컨트롤러 겸 시작 클래스','<code>pom.xml</code> — 의존성은 <code>spring-boot-starter-web</code> 하나'],
 sys:{have:[],new:['hello']},
 groups:[{x:30,y:28,w:400,h:150,label:'모놀리스 — 한 덩어리 앱'},{x:470,y:28,w:400,h:150,label:'마이크로서비스 — 기능별 작은 앱들'}],
 nodes:[N('m1',100,115,'🖥️ 화면',{w:110,h:48}),N('m2',230,115,'📄 라이선스',{w:110,h:48}),N('m3',360,115,'🏢 조직',{w:110,h:48}),
        N('s1',560,115,'📄 라이선스 서비스',{w:160,h:48,new:true}),N('s2',745,115,'🏢 조직 서비스',{w:160,h:48,new:true}),
        N('user',90,315,'👤 사용자',{kind:'user',w:120}),N('app',400,315,'Spring Boot 앱',{sub:'Application.java · 내장 톰캣 :8080',new:true,w:230}),
        N('resp',720,315,'{"message":"Hello 길동 홍"}',{kind:'note',sub:'JSON 응답',w:240})],
 edges:[E('m3','s1',{label:'쪼갠다',dashed:true}),E('user','app',{label:'GET /hello/길동?lastName=홍'}),E('app','resp',{label:'응답'})],
 steps:[
  {say:'지금까지 흔한 방식: 화면·라이선스·조직 기능이 전부 한 프로그램(모놀리스)에 들어 있어요. 한 군데만 고쳐도 전체를 다시 배포해야 하죠.',focus:['m1','m2','m3']},
  {say:'마이크로서비스는 기능별로 작은 앱으로 쪼개요. 각자 따로 만들고, 따로 배포하고, 많이 쓰이는 것만 따로 늘릴 수 있어요.',focus:['s1','s2'],move:[['m3','s1']]},
  {say:'그 "작은 앱"을 만드는 도구가 Spring Boot. 1장은 가장 작은 앱 하나를 띄워 봅니다 — 자바 파일 한 개, 설정 0줄.',focus:['app']},
  {say:'사용자가 브라우저(또는 curl)로 GET /hello/길동?lastName=홍 을 보내면…',focus:['user','app'],move:[['user','app']]},
  {say:'앱이 JSON으로 답해요. "URL로 요청하고 JSON으로 답한다" — 이게 REST API이고, 앞으로 모든 서비스가 이렇게 대화합니다.',focus:['app','resp'],move:[['app','resp']]}]
},
{
 num:'2장', title:'스프링 클라우드와 마이크로서비스 세계', en:'Exploring the microservices world with Spring Cloud', page:'chapter02.html',
 one:'이 장은 지도예요. 빈 프로젝트(licensing-service)를 만들고, 앞으로 어떤 부품이 하나씩 붙을지 미리 둘러봅니다.',
 why:'<p>서비스를 여러 개로 쪼개는 순간 새 고민이 생겨요. "설정은 어디에?", "서로 주소를 어떻게 알지?", "하나가 죽으면?", "로그인은?" — 모놀리스에선 없던 문제들입니다.</p>',
 how:'<p>Spring Cloud는 이런 고민마다 준비된 부품을 줍니다. 2장에서는 Spring Initializr로 뼈대만 만들고, 부품은 5장부터 하나씩 붙여요. 설계 원칙으로 <b>12 팩터 앱</b>(설정 분리, 로그는 스트림으로, 무상태 등)을 소개합니다.</p>',
 look:['<code>chapter2/licensing-service/…/LicenseServiceApplication.java</code> — <code>@SpringBootApplication</code> 하나뿐','<code>pom.xml</code> — web, actuator, lombok'],
 sys:{have:[],new:['ls']},
 groups:[],
 nodes:[N('ls',450,235,'라이선싱 서비스 (뼈대)',{sub:'licensing-service · 아직 텅 빔',new:true,w:210}),
        N('cfg',170,90,'⚙️ Config 서버',{sub:'설정 한곳에 · 5장',kind:'infra'}),N('eur',450,70,'📒 Eureka',{sub:'서비스 주소록 · 6장',kind:'infra'}),N('r4j',730,90,'🛡️ Resilience4j',{sub:'장애 버티기 · 7장',kind:'infra'}),
        N('gw',110,235,'🚪 Gateway',{sub:'하나의 입구 · 8장',kind:'infra'}),N('sec',790,235,'🔐 보안',{sub:'로그인·토큰 · 9장',kind:'infra'}),
        N('msg',170,390,'📨 Kafka',{sub:'이벤트 전달 · 10장',kind:'infra'}),N('trc',450,410,'🔍 Sleuth / Zipkin',{sub:'로그 추적 · 11장',kind:'infra',w:170}),N('dep',730,390,'☁️ 배포',{sub:'Docker · K8s · 4·12장',kind:'infra'})],
 edges:['cfg','eur','r4j','gw','sec','msg','trc','dep'].map(t=>E('ls',t,{dashed:true,arrow:false})),
 steps:[
  {say:'2장은 지도를 펼치는 장. Spring Initializr로 빈 프로젝트 licensing-service 를 만들어요. 아직 엔드포인트가 하나도 없습니다.',focus:['ls']},
  {say:'서비스가 늘면 설정 파일도 늘어요. 한곳에서 나눠주는 Config 서버 → 5장.',focus:['ls','cfg'],move:[['ls','cfg']]},
  {say:'서비스가 어디(IP:포트)에 떠 있는지 적어두는 주소록, Eureka → 6장.',focus:['ls','eur'],move:[['ls','eur']]},
  {say:'옆 서비스가 느려져도 나까지 죽지 않게 버티는 Resilience4j → 7장.',focus:['ls','r4j'],move:[['ls','r4j']]},
  {say:'사용자는 입구 하나만 알면 되게 하는 Gateway → 8장.',focus:['ls','gw'],move:[['ls','gw']]},
  {say:'로그인과 권한을 토큰으로 처리하는 보안(Keycloak/OAuth2) → 9장.',focus:['ls','sec'],move:[['ls','sec']]},
  {say:'서비스끼리 직접 부르지 않고 메시지로 알리는 Kafka → 10장.',focus:['ls','msg'],move:[['ls','msg']]},
  {say:'요청 하나가 여러 서비스를 지날 때 한 줄로 추적하는 Sleuth/Zipkin/ELK → 11장.',focus:['ls','trc'],move:[['ls','trc']]},
  {say:'Docker(4장)로 포장해서 AWS 쿠버네티스에 올리는 배포 → 12장. 이제 한 장씩 쌓아 봅시다!',focus:['ls','dep'],move:[['ls','dep']]}]
},
{
 num:'3장', title:'스프링 부트로 마이크로서비스 구축하기', en:'Building microservices with Spring Boot', page:'chapter03.html',
 one:'컨트롤러 → 서비스 → 모델, 세 층으로 나눠 진짜 REST API를 만듭니다. 아직 DB는 없어요.',

// ───────────────────────────── 렌더링 ─────────────────────────────
const SVGNS='http://www.w3.org/2000/svg';
const svg=document.getElementById('svg');
let cur=0, stepIdx=0, playing=false, token=0;
let nodeMap={}, edgeMap={};

function el(tag,attrs={},parent){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function clip(a,b){ // a의 테두리 위, b 방향 점
  const hw=a.w/2,hh=a.h/2,dx=b.x-a.x,dy=b.y-a.y;
  if(!dx&&!dy)return{x:a.x,y:a.y};
  const t=Math.min(dx?hw/Math.abs(dx):1e9, dy?hh/Math.abs(dy):1e9);
  return{x:a.x+dx*t,y:a.y+dy*t};
}
function pathD(e){
  const a=nodeMap[e.f],b=nodeMap[e.t];
  if(e.bend){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,cx=mx-dy/L*e.bend,cy=my+dx/L*e.bend;
    const p1=clip(a,{x:cx,y:cy}),p2=clip(b,{x:cx,y:cy});return `M${p1.x},${p1.y} Q${cx},${cy} ${p2.x},${p2.y}`;}
  const p1=clip(a,b),p2=clip(b,a);return `M${p1.x},${p1.y} L${p2.x},${p2.y}`;
}
function render(ch){
  svg.innerHTML='';nodeMap={};edgeMap={};
  const defs=el('defs',{},svg);
  const mk=(id,cls)=>{const m=el('marker',{id,viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'8',markerHeight:'8',orient:'auto-start-reverse'},defs);el('path',{d:'M0,0 L10,5 L0,10 z',class:cls},m);};
  mk('arr','arrhead');mk('arrA','arrheadA');
  const st=el('style',{},defs);st.textContent='.arrhead{fill:var(--muted)} .arrheadA{fill:var(--packet)}';
  ch.nodes.forEach(n=>nodeMap[n.id]=n);
  (ch.groups||[]).forEach(g=>{const G=el('g',{class:'group'},svg);el('rect',{x:g.x,y:g.y,width:g.w,height:g.h},G);const t=el('text',{x:g.x+12,y:g.y+16},G);t.textContent=g.label;});
  const gE=el('g',{},svg);
  ch.edges.forEach(e=>{
    const G=el('g',{class:'edge'+(e.dashed?' dashed':'')},gE);
    const p=el('path',{d:pathD(e)},G);if(e.arrow)p.setAttribute('marker-end','url(#arr)');
    if(e.label){const L=p.getTotalLength(),m=p.getPointAtLength(L/2);const t=el('text',{x:m.x,y:m.y-7,'text-anchor':'middle'},G);t.textContent=e.label;}
    edgeMap[e.f+'>'+e.t]={g:G,p,e};
  });
  const gN=el('g',{},svg);
  ch.nodes.forEach(n=>{
    const G=el('g',{class:'node '+n.kind+(n.isNew?' isnew':''),id:'n-'+n.id},gN);
    el('rect',{x:n.x-n.w/2,y:n.y-n.h/2,width:n.w,height:n.h,rx:n.kind==='state'?n.h/2:10},G);
    const ty=n.sub?n.y-4:n.y+5;
    const t=el('text',{x:n.x,y:ty,'text-anchor':'middle',class:'lbl'},G);t.textContent=n.label;
    if(n.sub){const s=el('text',{x:n.x,y:n.y+15,'text-anchor':'middle',class:'sub'},G);s.textContent=n.sub;}
    if(n.isNew){el('rect',{x:n.x+n.w/2-30,y:n.y-n.h/2-8,width:30,height:14,rx:4,class:'badgebg'},G);const b=el('text',{x:n.x+n.w/2-15,y:n.y-n.h/2+3,'text-anchor':'middle',class:'badge'},G);b.textContent='NEW';}
  });
  const lg=el('text',{x:12,y:484,class:'legend'},svg);lg.textContent='● 파란 점 = 요청/메시지의 이동  ·  NEW = 이 장에서 새로 생긴 것  ·  점선 = 참고 관계';
}
function setFocus(step){
  const f=new Set(step.focus||[]);
  const moveKeys=new Set();(step.move||[]).forEach(([a,b])=>{moveKeys.add(a+'>'+b);moveKeys.add(b+'>'+a);});
  document.querySelectorAll('#svg .node').forEach(g=>{const id=g.id.slice(2);g.classList.toggle('focus',f.has(id));g.classList.toggle('dimmed',f.size>0&&!f.has(id));});
  for(const k in edgeMap){const {g,e}=edgeMap[k];const involved=moveKeys.has(k)||(f.has(e.f)&&f.has(e.t));g.classList.toggle('active',moveKeys.has(k));g.classList.toggle('dimmed',f.size>0&&!involved);}
}
function wait(ms,tk){return new Promise(r=>setTimeout(()=>r(tk===token),ms));}
function travel(from,to,tk){
  let rec=edgeMap[from+'>'+to],rev=false,tmp=null;
  if(!rec){rec=edgeMap[to+'>'+from];rev=!!rec;}
  let p=rec?rec.p:null;
  if(!p){tmp=el('path',{d:pathD(E(from,to)),style:'fill:none;stroke:none'},svg);p=tmp;}
  const L=p.getTotalLength(),c=el('circle',{r:8,class:'packet'},svg),dur=Math.max(650,Math.min(1300,L*2.2));
  return new Promise(res=>{const t0=performance.now();(function fr(now){
    if(tk!==token){c.remove();tmp&&tmp.remove();return res(false);}
    const k=Math.min(1,(now-t0)/dur),e=k<.5?2*k*k:-1+(4-2*k)*k,pt=p.getPointAtLength((rev?1-e:e)*L);
    c.setAttribute('cx',pt.x);c.setAttribute('cy',pt.y);
    if(k<1)requestAnimationFrame(fr);else{c.remove();tmp&&tmp.remove();pulse(to);res(true);}
  })(t0);});
}
function pulse(id){const g=document.getElementById('n-'+id);if(!g)return;const r=g.querySelector('rect');r.style.transition='none';r.style.strokeWidth='5';requestAnimationFrame(()=>{r.style.transition='stroke-width .5s';r.style.strokeWidth='';});}
function showStep(i){
  const ch=CH[cur];stepIdx=Math.max(0,Math.min(ch.steps.length-1,i));const s=ch.steps[stepIdx];
  document.getElementById('capIdx').textContent=stepIdx+1;document.getElementById('capText').textContent=s.say;
  document.querySelectorAll('#cSteps li').forEach((li,k)=>li.classList.toggle('cur',k===stepIdx));
  setFocus(s);
  document.getElementById('btnPrevStep').disabled=stepIdx===0;
  document.getElementById('btnNextStep').disabled=stepIdx===ch.steps.length-1;
}
async function runStep(i,tk){showStep(i);for(const [a,b] of (CH[cur].steps[stepIdx].move||[])){if(!(await travel(a,b,tk)))return false;}return tk===token;}
async function play(from){
  playing=true;updatePlayBtn();const tk=++token;
  for(let i=from;i<CH[cur].steps.length;i++){if(!(await runStep(i,tk)))return;if(!(await wait(CH[cur].steps[i].move?1500:2300,tk)))return;}
  if(tk===token){playing=false;updatePlayBtn();}
}
function stop(){token++;playing=false;updatePlayBtn();}
function updatePlayBtn(){const b=document.getElementById('btnPlay');const last=stepIdx>=CH[cur].steps.length-1;b.textContent=playing?'⏸ 일시정지':(last?'▶ 다시 보기':'▶ 이어서 재생');}

function goto(i,opts={}){
  cur=Math.max(0,Math.min(CH.length-1,i));const ch=CH[cur];stop();
  location.hash='#'+(cur+1);
  document.getElementById('cNum').textContent=ch.num+' · '+ch.page.replace('.html','').replace('chapter0','chapter');
  document.getElementById('cTitle').textContent=ch.title;document.getElementById('cEn').textContent=ch.en;
  document.getElementById('cOne').textContent=ch.one;
  document.getElementById('cWhy').innerHTML=ch.why;document.getElementById('cHow').innerHTML=ch.how;
  document.getElementById('cLook').innerHTML=ch.look.map(x=>'<li>'+x+'</li>').join('');
  document.getElementById('cLink').href=ch.page;
  const sys=document.getElementById('cSys');sys.innerHTML='<span>지금까지의 시스템:</span>'+ch.sys.have.map(k=>'<span class="chip">'+COMP[k]+'</span>').join('')+ch.sys.new.map(k=>'<span class="chip new">'+COMP[k]+'</span>').join('');
  const ol=document.getElementById('cSteps');ol.innerHTML='';ch.steps.forEach((s,k)=>{const li=document.createElement('li');li.innerHTML='<span class="n">'+(k+1)+'</span><span>'+s.say.split(/[.!?]\s/)[0].slice(0,60)+(s.say.length>60?'…':'')+'</span>';li.onclick=()=>{stop();runStep(k,++token);};ol.appendChild(li);});
  document.querySelectorAll('#dots button').forEach((b,k)=>{b.classList.toggle('cur',k===cur);b.classList.toggle('done',k<cur);});
  document.getElementById('btnPrev').disabled=cur===0;document.getElementById('btnNext').disabled=cur===CH.length-1;
  document.getElementById('prevLabel').textContent=cur>0?'← '+CH[cur-1].num+' '+CH[cur-1].title:'—';
  document.getElementById('nextLabel').textContent=cur<CH.length-1?CH[cur+1].num+' '+CH[cur+1].title+' →':'끝';
  document.getElementById('count').textContent=(cur+1)+' / '+CH.length;
  render(ch);showStep(0);
  if(!opts.noScroll)window.scrollTo({top:0,behavior:'smooth'});
  const tk=token;setTimeout(()=>{if(tk===token)play(0);},500);
}
// 컨트롤
document.getElementById('btnPlay').onclick=()=>{if(playing)stop();else play(stepIdx>=CH[cur].steps.length-1?0:stepIdx);};
document.getElementById('btnNextStep').onclick=()=>{stop();runStep(stepIdx+1,++token);};
document.getElementById('btnPrevStep').onclick=()=>{stop();runStep(stepIdx-1,++token);};
document.getElementById('btnRestart').onclick=()=>{stop();play(0);};
document.getElementById('btnPrev').onclick=()=>goto(cur-1);
document.getElementById('btnNext').onclick=()=>goto(cur+1);
const dots=document.getElementById('dots');CH.forEach((c,k)=>{const b=document.createElement('button');b.textContent=k===CH.length-1?'부':(k+1);b.title=c.num+' '+c.title;b.onclick=()=>goto(k);dots.appendChild(b);});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')goto(cur+1);else if(e.key==='ArrowLeft')goto(cur-1);else if(e.key===' '){e.preventDefault();document.getElementById('btnPlay').click();}});
const h=parseInt((location.hash||'#1').slice(1),10);goto(isNaN(h)?0:h-1,{noScroll:true});
</script>
